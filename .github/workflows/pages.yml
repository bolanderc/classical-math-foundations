name: Deploy Classical Math Foundations

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render math HTML
        run: quarto render euclid-elements --to html

      - name: Start Pages site with HTML output
        shell: bash
        run: |
          mkdir -p _site
          cp -R euclid-elements/_book/* _site/

      - name: Render math EPUB
        run: quarto render euclid-elements --to epub

      - name: Add EPUB download
        shell: bash
        run: |
          cp "euclid-elements/_book/Classical-Mathematics-Foundations--Euclid-s-Elements.epub" _site/classical-math-foundations.epub
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4